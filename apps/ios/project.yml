name: TodoTracker
options:
  bundleIdPrefix: com.reedwilliams24
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  TodoCore:
    path: TodoCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TodoTracker:
    type: application
    platform: iOS
    sources: [TodoTracker]
    dependencies:
      - package: TodoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reedwilliams24.todotracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Todo Tracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
  TodoTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TodoTrackerUITests]
    dependencies:
      - target: TodoTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reedwilliams24.todotracker.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TodoTracker
schemes:
  TodoTracker:
    build:
      targets:
        TodoTracker: all
    test:
      targets:
        - TodoTrackerUITests
