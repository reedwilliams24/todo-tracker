name: Screenshots

# Boots the Android emulator and the iOS Simulator, drives each app through
# .github/screenshots/flow.yaml with Maestro, and uploads the PNGs as artifacts.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/screenshots.yml
      - .github/screenshots/**

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android
      - run: ./gradlew :app:assembleDebug --console=plain
        working-directory: apps/android
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p screenshots && cd screenshots && maestro test -e APP_ID=com.reedwilliams24.todotracker -e PLATFORM=android ../.github/screenshots/flow.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-android
          path: |
            screenshots/
            ~/.maestro/tests/
          retention-days: 14

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios
      - name: Pick and boot an iPhone Simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
      - name: Build for the Simulator
        working-directory: apps/ios
        run: |
          xcodebuild build -project TodoTracker.xcodeproj -scheme TodoTracker \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath build \
            -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Take screenshots on the Simulator
        run: |
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          app=$(find apps/ios/build/Build/Products -maxdepth 2 -name 'TodoTracker.app' -not -path '*Runner*' | head -1)
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          mkdir -p screenshots && cd screenshots
          maestro --device "$SIMULATOR_UDID" test -e APP_ID=com.reedwilliams24.todotracker -e PLATFORM=ios ../.github/screenshots/flow.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ios
          path: |
            screenshots/
            ~/.maestro/tests/
          retention-days: 14
