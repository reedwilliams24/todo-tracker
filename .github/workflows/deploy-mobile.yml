name: Distribute mobile alpha

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "spec/**"
      - ".github/workflows/deploy-mobile.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    # Inert until the mobile secrets exist (see README "Deploying").
    if: ${{ vars.MOBILE_ALPHA_ENABLED == 'true' }}
    outputs:
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' }}
      ios: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ios == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - "apps/android/**"
              - "spec/**"
              - ".github/workflows/deploy-mobile.yml"
            ios:
              - "apps/ios/**"
              - "spec/**"
              - ".github/workflows/deploy-mobile.yml"

  android:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The release build type signs with the debug key. Restoring a fixed keystore keeps the
      # signature stable so testers can install each build over the previous one.
      - name: Restore signing keystore
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set; this APK gets a throwaway signature and won't install over earlier builds."
          fi
      - run: ./gradlew :core:test :app:assembleRelease --console=plain
      - name: Upload to Firebase App Distribution (group "alpha")
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          creds="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds"
          printf '%s\n\n%s\n' "${GITHUB_SHA::7}" "${COMMIT_MESSAGE:-Manual run}" > "$RUNNER_TEMP/release-notes.txt"
          GOOGLE_APPLICATION_CREDENTIALS="$creds" npx --yes firebase-tools@15.32.1 \
            appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" --groups alpha --release-notes-file "$RUNNER_TEMP/release-notes.txt"
          rm -f "$creds"
      - uses: actions/upload-artifact@v4
        with:
          name: android-alpha-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  ios:
    needs: changes
    # TestFlight needs a paid Apple Developer account, so iOS has its own switch.
    if: ${{ needs.changes.outputs.ios == 'true' && vars.IOS_TESTFLIGHT_ENABLED == 'true' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: TodoCore fixtures
        working-directory: apps/ios/TodoCore
        run: swift test
      - name: Install signing certificate and provisioning profile
        id: signing
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/alpha.mobileprovision"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain"

          security cms -D -i "$RUNNER_TEMP/alpha.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          team=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/alpha.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
          echo "profile=$uuid" >> "$GITHUB_OUTPUT"
          echo "team=$team" >> "$GITHUB_OUTPUT"
      - name: Archive
        run: |
          xcodegen generate
          xcodebuild archive -project TodoTracker.xcodeproj -scheme TodoTracker -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/TodoTracker.xcarchive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=${{ steps.signing.outputs.team }} \
            PROVISIONING_PROFILE_SPECIFIER=${{ steps.signing.outputs.profile }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Export IPA
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ steps.signing.outputs.team }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.reedwilliams24.todotracker</key><string>${{ steps.signing.outputs.profile }}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/TodoTracker.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8
          xcrun altool --upload-app -t ios -f build/export/TodoTracker.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP"/dist.p12 "$RUNNER_TEMP"/alpha.mobileprovision ~/.appstoreconnect/private_keys/AuthKey_*.p8
