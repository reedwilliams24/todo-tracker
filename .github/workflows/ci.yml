name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the main-only e2e jobs
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which platforms a PR touches. Anything outside apps/<platform> (spec, packages, root config,
  # workflows) counts for all three, so the shared contract is always re-tested everywhere.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      ios-app: ${{ steps.filter.outputs.ios-app }}
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'spec/**'
              - 'packages/**'
              - 'scripts/**'
              - '.github/**'
              - '*'
            web:
              - *shared
              - 'apps/web/**'
            android:
              - *shared
              - 'apps/android/**'
            ios:
              - *shared
              - 'apps/ios/**'
            ios-app:
              - 'apps/ios/TodoTracker/**'
              - 'apps/ios/TodoTrackerUITests/**'
              - 'apps/ios/project.yml'
              - 'apps/ios/Package.resolved'
              - '.github/actions/ios/**'
              - '.github/workflows/ci.yml'
            supabase:
              - *shared
              - 'supabase/**'

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint # ESLint

  lint-android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android
      - run: ./gradlew :app:lintDebug --console=plain

  lint-ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - run: swiftlint lint --strict --quiet # configured in apps/ios/.swiftlint.yml

  # ---------------------------------------------------------------- formatting (every PR)
  # Fix locally with `pnpm format` (or format:web / format:android / format:ios).

  format-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:web:check # Prettier

  format-android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android
      - run: ./gradlew spotlessCheck --console=plain # ktfmt via Spotless

  # Pinned to the toolchain version `pnpm format:ios` is run with, so local and CI output match.
  format-ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    container: swift:6.1.2
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/swift-format.sh lint --strict # Apple's swift-format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm spec:check
      - run: pnpm spec:parity

  # ---------------------------------------------------------------- unit tests (every PR)

  unit-tests-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test # vitest in apps/web/src/domain + the TypeScript fixture runner in packages/spec

  unit-tests-android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android
      - run: ./gradlew :core:test --console=plain # JUnit fixture runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-core-test-reports
          path: apps/android/core/build/reports/tests/
          retention-days: 14

  unit-tests-ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios/TodoCore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: apps/ios/TodoCore/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/ios/TodoCore/Package.swift', 'apps/ios/TodoCore/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - run: swift test # XCTest fixture runner, no Simulator

  # pgTAP tests for the schema, RLS and push_todos (supabase/tests) against a local stack.
  db-tests-supabase:
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io # public.ecr.aws throttles runners ("toomanyrequests: Data limit exceeded")
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup # installs the pinned supabase CLI
      - run: pnpm exec supabase db start # Postgres only; applies supabase/migrations to a fresh database
      - run: pnpm exec supabase test db

  # Signed-in web flows against a local Supabase stack, codes read from Mailpit: the `"requires": "supabase"`
  # scenarios plus apps/web/e2e/two-device.spec.ts (two browser contexts on one account, synced over Realtime).
  e2e-sync-web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io # public.ecr.aws throttles runners (see db-tests-supabase)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup # installs the pinned supabase CLI
      - run: pnpm exec supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e:auth # builds the web app with the local keys (playwright.config.ts)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-sync
          path: apps/web/playwright-report/
          retention-days: 14
      - if: always()
        run: pnpm exec supabase stop --no-backup

  # Compiles the SwiftUI app (no tests) when the app target changes on a PR, so UI-code breakage
  # is caught before main. The XCUITest and Maestro flows run in e2e-tests-ios on main.
  # ---------------------------------------------------------------- builds (every PR, per touched platform)
  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build # next build of apps/web

  build-android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android
      - run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-ios:
    needs: changes
    if: needs.changes.outputs.ios-app == 'true' && github.event_name != 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios
      - name: Build for the Simulator
        working-directory: apps/ios
        run: |
          xcodebuild build -project TodoTracker.xcodeproj -scheme TodoTracker \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build \
            -onlyUsePackageVersionsFromResolvedFile ARCHS=arm64 CODE_SIGNING_ALLOWED=NO

  # The only check the main ruleset requires. Passes when every PR job above passed or was
  # skipped by the path filter, so jobs can be added/renamed here without touching the ruleset.
  ci:
    name: Required CI Checks
    needs:
      - lint-web
      - lint-android
      - lint-ios
      - format-web
      - format-android
      - format-ios
      - typecheck
      - spec
      - unit-tests-web
      - unit-tests-android
      - unit-tests-ios
      - build-web
      - build-android
      - build-ios
      - db-tests-supabase
      - e2e-sync-web
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | map(select(.value.result == "failure" or .value.result == "cancelled")) | length == 0' \
            || { echo "::error::a required job failed or was cancelled"; exit 1; }

  # ---------------------------------------------------------------- e2e tests (push to main)

  e2e-tests-web:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e # Playwright: spec/scenarios/core/*.json + apps/web/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  # Guest flows (`spec` tag) on an unconfigured build, then the signed-in flows (`supabase` tag) on a build pointed at
  # a local Supabase stack; mailpit-code.js reads the emailed codes from Mailpit on the runner.
  e2e-tests-android:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    runs-on: ubuntu-latest
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io # public.ecr.aws throttles runners (see db-tests-supabase)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup # installs the pinned supabase CLI
      - uses: ./.github/actions/android
      - run: pnpm exec supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor
      - name: Build the guest and the Supabase-configured APKs
        working-directory: apps/android
        run: |
          ./gradlew :app:assembleDebug --console=plain
          mv app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/guest.apk"
          key=$(pnpm exec supabase status -o env | sed -n -E 's/^(PUBLISHABLE_KEY|ANON_KEY)="?([^"]*)"?$/\2/p' | head -1)
          ./gradlew :app:assembleDebug --console=plain -PsupabaseUrl=http://10.0.2.2:54321 -PsupabaseAnonKey="$key"
          mv app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/supabase.apk"
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r "$RUNNER_TEMP/guest.apk"
            maestro test --include-tags spec -e APP_ID=com.reedwilliams24.todotracker --format junit --output maestro-android.xml spec/scenarios/maestro
            adb install -r "$RUNNER_TEMP/supabase.apk"
            maestro test --include-tags supabase -e APP_ID=com.reedwilliams24.todotracker --format junit --output maestro-android-supabase.xml spec/scenarios/maestro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-android
          path: |
            maestro-android*.xml
            ~/.maestro/tests/
          retention-days: 14

  e2e-tests-ios:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios
      - name: Pick and boot an iPhone Simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
      - name: Build and run the XCUITests on the Simulator
        run: |
          xcodebuild build test -project TodoTracker.xcodeproj -scheme TodoTracker \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath build \
            -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run Maestro flows on the Simulator
        run: |
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          app=$(find build/Build/Products -maxdepth 2 -name 'TodoTracker.app' -not -path '*Runner*' | head -1)
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          maestro --device "$SIMULATOR_UDID" test --include-tags spec -e APP_ID=com.reedwilliams24.todotracker --format junit --output maestro-ios.xml ../../spec/scenarios/maestro
      # macOS runners have no Docker for `supabase start`, so iOS runs the sign-in flows against scripts/supabase-mock.py.
      - name: Run Maestro sign-in flows against the Supabase mock
        run: |
          python3 ../../scripts/supabase-mock.py > supabase-mock.log 2>&1 &
          printf 'SUPABASE_URL = http:/$()/127.0.0.1:54321\nSUPABASE_ANON_KEY = sb_publishable_local-mock\n' > Config/Supabase.override.xcconfig
          # Ad-hoc signed: unsigned Simulator builds can't use the Keychain (-34018), where the session lives.
          xcodebuild build -project TodoTracker.xcodeproj -scheme TodoTracker \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath build-supabase \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          xcrun simctl install "$SIMULATOR_UDID" build-supabase/Build/Products/Debug-iphonesimulator/TodoTracker.app
          status=0
          # One run per flow: Maestro's clearState doesn't clear the Keychain, so reset it before each.
          for flow in $(grep -l '^  - supabase$' ../../spec/scenarios/maestro/*.yaml); do
            xcrun simctl keychain "$SIMULATOR_UDID" reset
            maestro --device "$SIMULATOR_UDID" test -e APP_ID=com.reedwilliams24.todotracker \
              --format junit --output "maestro-ios-supabase-$(basename "$flow" .yaml).xml" "$flow" || status=1
          done
          python3 - maestro-ios-supabase-*.xml <<'EOF'
          import sys, xml.etree.ElementTree as ET
          merged = ET.Element("testsuites")
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              merged.extend(list(root) if root.tag == "testsuites" else [root])
          ET.ElementTree(merged).write("maestro-ios-supabase.xml", encoding="utf-8", xml_declaration=True)
          EOF
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-ios
          path: |
            apps/ios/maestro-ios.xml
            apps/ios/maestro-ios-supabase.xml
            apps/ios/supabase-mock.log
            ~/.maestro/tests/
          retention-days: 14
