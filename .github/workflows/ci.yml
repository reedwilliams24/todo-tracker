name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the main-only e2e jobs
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which platforms a PR touches. Anything outside apps/<platform> (spec, packages, root config,
  # workflows) counts for all three, so the shared contract is always re-tested everywhere.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      ios-app: ${{ steps.filter.outputs.ios-app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'spec/**'
              - 'packages/**'
              - 'scripts/**'
              - '.github/**'
              - '*'
            web:
              - *shared
              - 'apps/web/**'
            android:
              - *shared
              - 'apps/android/**'
            ios:
              - *shared
              - 'apps/ios/**'
            ios-app:
              - 'apps/ios/TodoTracker/**'
              - 'apps/ios/TodoTrackerUITests/**'
              - 'apps/ios/project.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm spec:check
      - run: pnpm spec:parity

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  # ---------------------------------------------------------------- unit tests (every PR)

  unit-tests-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test # vitest in apps/web/src/domain + the TypeScript fixture runner in packages/spec

  unit-tests-android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android
      - run: ./gradlew :core:test :app:assembleDebug :app:lintDebug --console=plain # JUnit fixture runner, then APK + lint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-apk
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/core/build/reports/tests/
          retention-days: 14

  unit-tests-ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios/TodoCore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: apps/ios/TodoCore/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/ios/TodoCore/Package.swift', 'apps/ios/TodoCore/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - run: swift test # XCTest fixture runner, no Simulator

  # Compiles the SwiftUI app (no tests) when the app target changes on a PR, so UI-code breakage
  # is caught before main. The XCUITest and Maestro flows run in e2e-tests-ios on main.
  build-ios:
    needs: changes
    if: needs.changes.outputs.ios-app == 'true' && github.event_name != 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios
      - name: Build for the Simulator
        working-directory: apps/ios
        run: |
          xcodebuild build -project TodoTracker.xcodeproj -scheme TodoTracker \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

  # ---------------------------------------------------------------- e2e tests (push to main)

  e2e-tests-web:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e # Playwright: spec/scenarios/core.json + apps/web/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  e2e-tests-android:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android
      - run: ./gradlew :app:assembleDebug --console=plain
        working-directory: apps/android
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test --include-tags spec -e APP_ID=com.reedwilliams24.todotracker --format junit --output maestro-android.xml spec/scenarios/maestro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-android
          path: |
            maestro-android.xml
            ~/.maestro/tests/
          retention-days: 14

  e2e-tests-ios:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios
      - name: Build and run the XCUITests on the Simulator
        run: |
          xcodebuild build test -project TodoTracker.xcodeproj -scheme TodoTracker \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run Maestro flows on the Simulator
        run: |
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          app=$(find build/Build/Products -maxdepth 2 -name 'TodoTracker.app' -not -path '*Runner*' | head -1)
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          maestro --device "$SIMULATOR_UDID" test --include-tags spec -e APP_ID=com.reedwilliams24.todotracker --format junit --output maestro-ios.xml ../../spec/scenarios/maestro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-ios
          path: |
            apps/ios/maestro-ios.xml
            ~/.maestro/tests/
          retention-days: 14
