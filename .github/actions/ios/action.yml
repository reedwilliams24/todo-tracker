name: Setup iOS
description: xcodegen, cached DerivedData/SwiftPM, and a booted iPhone Simulator (exports SIMULATOR_UDID)

runs:
  using: composite
  steps:
    - run: brew install xcodegen
      shell: bash
    - uses: actions/cache@v4
      with:
        path: |
          apps/ios/build
          apps/ios/TodoCore/.build
        key: xcode-${{ runner.os }}-${{ hashFiles('apps/ios/**/*.swift', 'apps/ios/project.yml', 'apps/ios/TodoCore/Package.swift') }}
        restore-keys: xcode-${{ runner.os }}-
    - run: xcodegen generate
      shell: bash
      working-directory: apps/ios
    - name: Pick and boot an iPhone Simulator
      shell: bash
      run: |
        udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
        echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
        xcrun simctl boot "$udid" || true
