name: Setup iOS
description: xcodegen, cached DerivedData/SwiftPM, and the pinned Swift packages (apps/ios/Package.resolved). Boots no Simulator.

runs:
  using: composite
  steps:
    - run: brew install xcodegen
      shell: bash
    - uses: actions/cache@v4
      with:
        path: |
          apps/ios/build
          apps/ios/TodoCore/.build
        key: xcode-${{ runner.os }}-${{ hashFiles('apps/ios/**/*.swift', 'apps/ios/project.yml', 'apps/ios/TodoCore/Package.swift', 'apps/ios/Package.resolved') }}
        restore-keys: xcode-${{ runner.os }}-
    - run: xcodegen generate
      shell: bash
      working-directory: apps/ios
    - name: Pin Swift packages to Package.resolved
      shell: bash
      working-directory: apps/ios
      run: |
        dir=TodoTracker.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
        mkdir -p "$dir"
        cp Package.resolved "$dir/Package.resolved"
