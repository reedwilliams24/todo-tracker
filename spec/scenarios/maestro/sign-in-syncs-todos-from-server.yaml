# Generated from spec/scenarios/core/sign-in-syncs-todos-from-server.json by `pnpm spec:generate`. Do not edit.
appId: ${APP_ID}
name: sign-in-syncs-todos-from-server
tags:
  - supabase
---
- runFlow: launch.yaml
- evalScript: ${output.run = String(Date.now())}
- tapOn:
    id: "auth-sign-in"
- tapOn:
    id: "auth-email"
- inputText: "sync.${output.run}@example.com"
- hideKeyboard
- tapOn:
    id: "auth-send-code"
- assertVisible:
    id: "auth-code"
- runScript:
    file: mailpit-code.js
    env:
      EMAIL: "sync.${output.run}@example.com"
- tapOn:
    id: "auth-code"
- eraseText: 10
- inputText: "${output.code}"
- hideKeyboard
- tapOn:
    id: "auth-verify"
- assertVisible:
    id: "auth-account"
    text: "sync\\.${output.run}@example\\.com"
- tapOn:
    id: "todo-form-title"
- inputText: "Pay rent"
- hideKeyboard
- tapOn:
    id: "todo-form-submit"
- assertVisible:
    id: "todo-item-Pay rent"
- assertVisible:
    id: "todo-item-Pay rent"
- stopApp
- launchApp:
    clearState: false
    arguments:
      forgetLocalTodos: true
- extendedWaitUntil:
    visible:
      id: "todo-form-title"
    timeout: 60000
- runFlow: relaunch.yaml
- assertVisible:
    id: "todo-item-Pay rent"
